name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-checks:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check README sections and citation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "## Industrial problem",
              "## Data (no plant data)",
              "## Tool chain",
              "## Journal references",
              "## Validation & claims",
              "## Limitations",
          ]
          readme = Path("README.md").read_text(encoding="utf-8")
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          errors = []

          missing = [section for section in required if section not in readme]
          if missing:
              errors.append("README.md missing: " + ", ".join(missing))
          if "cff-version:" not in citation:
              errors.append("CITATION.cff has no cff-version field")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("README sections and CITATION.cff: OK")
          PY

  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -leo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create conda environment from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true

      - name: Install steelgate in editable mode
        run: python -m pip install --no-deps -e .

      - name: Run pytest suite
        run: python -m pytest -v
